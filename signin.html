<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — CareSync AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="/static/js/main.js" defer></script>
    <script src="/static/js/auth.js" defer></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-white text-slate-900 antialiased min-h-screen w-screen m-0 p-0 overflow-x-hidden selection:bg-indigo-500 selection:text-white">

    <!-- FULL SCREEN 100vw x 100vh AUTH CONTAINER -->
    <div class="w-full min-h-screen h-screen grid grid-cols-1 lg:grid-cols-12 overflow-hidden bg-white">
        
        <!-- LEFT FORM SIDE (Spans 6 cols on large screens, centered, full height) -->
        <div class="lg:col-span-6 p-8 sm:p-12 lg:p-16 flex flex-col justify-between h-full overflow-y-auto bg-white relative z-10 space-y-6">
            
            <!-- Top Header Row: Logo & Close (X) Button -->
            <div class="flex items-center justify-between w-full">
                <!-- Logo Header -->
                <a href="/" class="flex items-center gap-3 group">
                    <div class="w-10 h-10 bg-[#5B42F3] rounded-2xl flex items-center justify-center text-white shadow-md shadow-indigo-200 group-hover:scale-105 transition duration-200">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                            <path d="M12 8v6M9 11h6" stroke="#FFFFFF" stroke-width="2"/>
                        </svg>
                    </div>
                    <div>
                        <div class="font-extrabold text-slate-900 text-lg leading-tight tracking-tight">CareSync AI</div>
                        <div class="text-[10px] font-bold text-[#5B42F3] tracking-wider uppercase">Smarter Hospitals</div>
                    </div>
                </a>

                <!-- Close (X) Button to Home -->
                <a href="/" title="Close" class="w-10 h-10 rounded-full bg-slate-700 hover:bg-slate-900 text-white flex items-center justify-center shadow-md transition transform hover:scale-105">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </a>
            </div>

            <!-- Form Wrapper -->
            <div class="max-w-md w-full mx-auto space-y-6 my-auto">
                <!-- Heading -->
                <div class="space-y-1">
                    <h1 class="text-3xl sm:text-4xl font-black text-slate-900 tracking-tight">Welcome Back</h1>
                    <p class="text-xs sm:text-sm text-slate-500 font-medium">Sign in to continue to CareSync AI</p>
                </div>

                <!-- Form -->
                <form id="signinForm" class="space-y-4">
                    
                    <!-- Email Input -->
                    <div class="space-y-1">
                        <label for="email" class="block text-xs font-bold text-slate-700 uppercase tracking-wider">Email Address</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                                <i data-lucide="mail" class="w-4 h-4"></i>
                            </div>
                            <input type="email" id="email" class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:border-indigo-600 focus:bg-white focus:ring-4 focus:ring-indigo-50 transition" placeholder="admin@hospital.com" required>
                        </div>
                    </div>

                    <!-- Password Input -->
                    <div class="space-y-1">
                        <label for="password" class="block text-xs font-bold text-slate-700 uppercase tracking-wider">Password</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                                <i data-lucide="lock" class="w-4 h-4"></i>
                            </div>
                            <input type="password" id="password" class="w-full pl-10 pr-10 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:border-indigo-600 focus:bg-white focus:ring-4 focus:ring-indigo-50 transition" placeholder="••••••••" required>
                            <button type="button" onclick="togglePasswordVisibility('password', 'togglePasswordIcon')" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none">
                                <i data-lucide="eye" id="togglePasswordIcon" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Options -->
                    <div class="flex items-center justify-between text-xs text-slate-600 pt-1">
                        <label class="flex items-center gap-2 cursor-pointer font-semibold select-none">
                            <input type="checkbox" checked class="w-4 h-4 rounded text-indigo-600 border-slate-300 focus:ring-indigo-500">
                            <span>Remember me</span>
                        </label>
                        <a href="#" class="font-bold text-indigo-600 hover:text-indigo-700 hover:underline">Forgot password?</a>
                    </div>

                    <!-- Sign In Button -->
                    <button type="submit" class="w-full py-3.5 px-4 bg-[#5B42F3] hover:bg-[#4C35E0] text-white text-sm font-bold rounded-xl shadow-md shadow-indigo-200 transition active:scale-[0.99]">
                        Sign In
                    </button>

                    <!-- Divider -->
                    <div class="relative flex items-center justify-center py-1">
                        <div class="border-t border-slate-200 w-full"></div>
                        <span class="bg-white px-3 text-[11px] font-bold uppercase tracking-wider text-slate-400 absolute">OR</span>
                    </div>

                    <!-- Google Sign In -->
                    <button type="button" class="w-full py-3 px-4 bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 rounded-xl text-xs font-bold transition flex items-center justify-center gap-3 shadow-xs">
                        <svg class="w-4 h-4" viewBox="0 0 24 24">
                            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                        </svg>
                        Continue with Google
                    </button>
                </form>

                <!-- Bottom Link -->
                <p class="text-center text-xs text-slate-500 pt-2 font-medium">
                    Don't have an account? <a href="/signup" class="font-bold text-indigo-600 hover:text-indigo-700 hover:underline">Sign Up</a>
                </p>
            </div>

            <!-- Footer Copyright -->
            <div class="text-xs text-slate-400 text-center sm:text-left">
                © 2026 CareSync AI. All rights reserved.
            </div>
        </div>

        <!-- RIGHT ILLUSTRATION SIDE (Full Bleed 100% Screen Height Image) -->
        <div class="lg:col-span-6 relative hidden lg:block overflow-hidden h-full">
            <img src="/static/images/pharmacy.jpg" alt="CareSync AI Hospital Pharmacy Illustration" class="w-full h-full object-cover object-center">
            
            <!-- Floating Glassmorphism Badge -->
            <div class="absolute bottom-10 left-10 right-10 bg-white/90 backdrop-blur-md p-6 rounded-2xl border border-white/80 shadow-2xl text-center">
                <div class="text-xl font-black text-slate-900 leading-tight">Better Medicines.</div>
                <div class="text-xs sm:text-sm font-bold text-indigo-600 mt-1">Healthier People. ♡</div>
            </div>
        </div>

    </div>

    <script>
        lucide.createIcons();

        function togglePasswordVisibility(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.setAttribute('data-lucide', 'eye-off');
            } else {
                input.type = 'password';
                icon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        }
    </script>
</body>
</html>
